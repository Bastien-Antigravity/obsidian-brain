name: Documentation Sync
description: Formal process to synchronize ecosystem maps and verify internal links.
steps:
  - name: Audit
    action: audit
    description: Preflight health check.
  - name: Ecosystem Mapping
    action: shell
    params:
      cmd: python3 08-Squad-Agent/main.py map-feats
    description: Generate the latest Ecosystem-Map-MOC.
  - name: Persona Update
    action: prompt
    persona: docmaintainer
    description: Review new features and update internal documentation nodes.
  - name: Link Verification
    action: shell
    params:
      cmd: python3 08-Squad-Agent/main.py fix-feats
    description: Auto-fix broken links and update YAML headers.
  - name: Signoff
    action: signoff
    description: Ritual mission closure.
