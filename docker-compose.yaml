services:
  rag-engine:
    build:
      context: ./09-RAG-Engine
      dockerfile: Dockerfile
    image: ghcr.io/bastien-antigravity/obsidian-rag-mcp:${TAG:-latest}
    container_name: rag-engine
    restart: unless-stopped
    ports:
      - "${RG_MCP_PORT:-8090}:8090"
      - "${RG_PORT:-8080}:8080"
      - "${DASHBOARD_PORT:-8082}:8082"
    volumes:
      # Mount this folder as the obsidian-brain workspace inside the RAG container
      - .:/app/obsidian-brain
    networks:
      - teleremote-network
    labels: [ com.centurylinklabs.watchtower.enable=true ]

  squad-agent:
    build:
      context: ./08-Squad-Agent
      dockerfile: Dockerfile
    image: ghcr.io/bastien-antigravity/squad-agent-brain:${TAG:-latest}
    container_name: squad-agent
    restart: unless-stopped
    ports:
      - "${SA_PORT:-8085}:8085"
      - "${SA_GRPC_PORT:-8087}:8087"
    volumes:
      # Mount this folder to allow Squad Agent to read/write outputs in the workspace
      - .:/app/obsidian-brain
    depends_on:
      - rag-engine
    networks:
      - teleremote-network
    labels: [ com.centurylinklabs.watchtower.enable=true ]

networks:
  teleremote-network:
    name: teleremote-network
    external: true
